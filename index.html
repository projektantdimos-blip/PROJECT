<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Проекты DS</title>
<meta name="description" content="Реестр проектных задач: стадии, сроки, занятость сотрудников">
<meta name="theme-color" content="#1f5c99">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Проекты DS">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="logo.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --blue:#1f5c99;--blue-d:#164a7d;--blue-l:#e8f0f8;--orange:#ee9264;
  --ink:#1d2733;--muted:#66717e;--line:#d6dde5;--bg:#f3f6f9;--card:#fff;--card2:#f8fafc;
  --ok:#1e7b46;--ok-l:#e3f2e9;--bad:#c0392b;--bad-l:#fbe8e5;--warn:#a86a00;--warn-l:#fbf0da;
  --st1:#7f93ab;--st2:#2b8a9a;--st3:#1f5c99;--st4:#d9782f;--st5:#7a55a8;--st6:#1e7b46;
  --shadow:0 1px 2px rgba(20,40,70,.06),0 4px 14px rgba(20,40,70,.06);
  --radius:14px;--on:#fff;--head:#1f5c99;
  --nav-h:64px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --blue:#6aa6e3;--blue-d:#8cbcec;--blue-l:#1a2c42;--orange:#f0a47e;
    --ink:#e4eaf1;--muted:#95a3b3;--line:#2a3848;--bg:#0e151e;--card:#16202c;--card2:#1b2734;
    --ok:#52c386;--ok-l:#153427;--bad:#f07a6c;--bad-l:#3a1d1b;--warn:#e3aa45;--warn-l:#3a2c12;
    --st1:#8fa2b8;--st2:#5cc0cf;--st3:#6aa6e3;--st4:#f0a060;--st5:#a88ad6;--st6:#52c386;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);--on:#0b1620;--head:#15304d;
  }
}
:root[data-theme="dark"]{
  --blue:#6aa6e3;--blue-d:#8cbcec;--blue-l:#1a2c42;--orange:#f0a47e;
  --ink:#e4eaf1;--muted:#95a3b3;--line:#2a3848;--bg:#0e151e;--card:#16202c;--card2:#1b2734;
  --ok:#52c386;--ok-l:#153427;--bad:#f07a6c;--bad-l:#3a1d1b;--warn:#e3aa45;--warn-l:#3a2c12;
  --st1:#8fa2b8;--st2:#5cc0cf;--st3:#6aa6e3;--st4:#f0a060;--st5:#a88ad6;--st6:#52c386;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);--on:#0b1620;--head:#15304d;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.4 "Segoe UI",Roboto,system-ui,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
svg{flex:none}

/* ---------- каркас ---------- */
.app{display:flex;min-height:100%}
.side{display:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));background:var(--head);color:#fff}
.top h1{font-size:18px;margin:0;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{font-size:12px;opacity:.85;display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:#9fd6b3;display:inline-block}
.sync.demo i{background:#f5c07a}.sync.off i{background:#f19b90}
.icon-btn{width:38px;height:38px;border-radius:10px;border:0;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center}
.icon-btn:hover{background:rgba(255,255,255,.24)}
.icon-btn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.view{display:none;padding:16px;padding-bottom:calc(var(--nav-h) + 24px + env(safe-area-inset-bottom))}
.view.on{display:block}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.bnav button{flex:1;height:var(--nav-h);border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px}
.bnav button.on{color:var(--blue)}
.fab{position:fixed;right:16px;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));z-index:31;height:52px;padding:0 20px 0 16px;border-radius:26px;border:0;background:var(--orange);color:var(--on);font-weight:600;display:flex;align-items:center;gap:8px;box-shadow:0 6px 18px rgba(238,146,100,.45)}

@media (min-width:900px){
  .side{display:flex;flex-direction:column;width:232px;flex:none;background:var(--blue-d);color:#fff;position:sticky;top:0;height:100vh;padding:18px 12px}
  :root[data-theme="dark"] .side{background:#101b28}
  .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 22px}
  .brand b{font-size:17px;display:block}.brand small{opacity:.75;font-size:12px}
  .top-logo{display:none}
  .side nav button{width:100%;display:flex;align-items:center;gap:12px;padding:11px 12px;border:0;border-radius:10px;background:none;color:rgba(255,255,255,.8);text-align:left;margin-bottom:4px}
  .side nav button:hover{background:rgba(255,255,255,.08)}
  .side nav button.on{background:rgba(255,255,255,.16);color:#fff;font-weight:600}
  .side .new{margin-top:14px;width:100%;height:44px;border:0;border-radius:10px;background:var(--orange);color:#fff;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
  .side .foot{margin-top:auto;font-size:12px;opacity:.6;padding:0 8px}
  .bnav,.fab{display:none}
  .top{background:var(--card);color:var(--ink);border-bottom:1px solid var(--line);padding:14px 24px}
  .top .icon-btn{background:var(--blue-l);color:var(--blue)}
  .top .icon-btn:hover{filter:brightness(.97)}
  .sync{color:var(--muted);opacity:1}
  .view{padding:24px;padding-bottom:40px}
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .side{background:#101b28}}

/* ---------- общие элементы ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.h2{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:22px 2px 10px}
.pill{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:12px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-l);color:var(--ok)}.pill.bad{background:var(--bad-l);color:var(--bad)}
.pill.warn{background:var(--warn-l);color:var(--warn)}.pill.info{background:var(--blue-l);color:var(--blue)}
.pill.muted{background:var(--card2);color:var(--muted);border:1px solid var(--line)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.ava{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;font-size:12px;font-weight:700;color:#fff;flex:none}
.ava.none{background:var(--card2);color:var(--muted);border:1px dashed var(--line)}
.empty{padding:28px;text-align:center;color:var(--muted)}

/* ---------- обзор ---------- */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tiles .tile:last-child{grid-column:span 2}
@media (min-width:640px){.tiles{grid-template-columns:repeat(5,1fr);gap:14px}.tiles .tile:last-child{grid-column:auto}}
.tile{padding:14px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);position:relative;overflow:hidden}
.tile:hover{border-color:var(--blue)}
.tile.on{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue) inset}
.tile .n{font-size:28px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .l{font-size:13px;color:var(--muted);margin-top:2px}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--blue))}
.stagebar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--card2);margin:14px 0 8px}
.stagebar span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend b{color:var(--ink);font-weight:600}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:18px 0 12px}
.search{flex:1 1 260px;display:flex;align-items:center;gap:8px;height:42px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--muted)}
.search input{flex:1;border:0;background:none;outline:none;color:var(--ink);min-width:0}
.sel{height:42px;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:0 10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin-bottom:12px}
.chips::-webkit-scrollbar{display:none}
.chip{height:34px;padding:0 13px;border-radius:17px;border:1px solid var(--line);background:var(--card);white-space:nowrap;display:inline-flex;align-items:center;gap:6px;font-size:14px}
.chip.on{background:var(--blue);border-color:var(--blue);color:var(--on)}
.chip small{opacity:.7}
.list{display:grid;gap:10px}
@media (min-width:1100px){.list{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1600px){.list{grid-template-columns:repeat(3,1fr)}}
.task{display:flex;text-align:left;width:100%;padding:0;border:1px solid var(--line);background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.task:hover{border-color:var(--blue)}
.task .prio{width:5px;flex:none}
.task .body{flex:1;min-width:0;padding:12px 14px}
.task .row1{display:flex;align-items:baseline;gap:10px;font-size:13px;color:var(--muted);min-width:0}
.task .row1 .cl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task .num{font-size:24px;font-weight:800;line-height:1.05;color:var(--blue);letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap}
.task .num small{font-size:14px;font-weight:700;opacity:.6;margin-right:1px}
.task .num.none{font-size:15px;color:var(--muted);font-weight:600}
.task .flags{align-self:center}
.col .task .num{font-size:20px}
.task .title{font-weight:600;margin:3px 0 10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.task .meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.task .meta .own{display:inline-flex;align-items:center;gap:6px;font-size:13px;margin-right:auto}
.task .flags{margin-left:auto;display:flex;gap:6px;align-items:center;color:var(--muted);font-size:12px}
.warn-ic{color:var(--warn)}

/* ---------- канбан ---------- */
.board{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:0 16px 8px;align-items:flex-start}
.col{flex:0 0 84vw;max-width:340px;scroll-snap-align:start;background:var(--card2);border:1px solid var(--line);border-radius:var(--radius);padding:10px;min-height:200px}
@media (min-width:900px){.board{margin:0;padding:0 0 8px}.col{flex:1 0 250px;max-width:none}}
.col.over{outline:2px dashed var(--blue);outline-offset:-4px}
.col h3{display:flex;align-items:center;gap:8px;margin:2px 4px 10px;font-size:14px}
.col h3 .cnt{margin-left:auto;font-size:12px;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:1px 8px}
.col .task{margin-bottom:8px;box-shadow:none}
.col .task[draggable=true]{cursor:grab}
.col .task.dragging{opacity:.4}
.col .task .title{margin-bottom:8px}

/* ---------- крайняя дата по договору на карточке ---------- */
.task .contract{display:flex;align-items:center;gap:6px;margin:-4px 0 8px;font-size:13px;font-weight:600;color:var(--muted)}
.task .contract svg{width:14px;height:14px}
.task .contract.none{font-weight:400;opacity:.75}
.task .contract.warn{color:var(--warn)}.task .contract.bad{color:var(--bad)}

/* ---------- срочные работы ---------- */
.task.urgent,.col .task.urgent{border-color:var(--bad);background:var(--bad-l);box-shadow:0 0 0 1px var(--bad) inset}
.task.urgent .prio{background:var(--bad)!important;width:7px}
.task.urgent .num{color:var(--bad)}
.task.urgent .pill.bad{background:var(--card);border:1px solid var(--bad)}
.urgent-pill{background:var(--bad);color:var(--on);gap:4px;height:22px;padding:0 8px}
.wk-item.urgent{background:var(--bad-l);box-shadow:inset 4px 0 0 var(--bad)}
.wk-item.urgent:hover{filter:brightness(.97);background:var(--bad-l)}
.wk-item.urgent .wk-top .num{color:var(--bad)}
.urgent-tgl{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 12px;margin-bottom:14px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.srv-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.srv-row .btn{height:40px;text-decoration:none}
.srv-row .btn.primary{flex:1;justify-content:center;font-weight:600;min-width:200px}
@media (pointer:coarse){.srv-row{display:none}}
.urgent-tgl:disabled{opacity:.55;cursor:not-allowed}
.urgent-tgl>span{flex:1;min-width:0}
.urgent-tgl small{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.urgent-tgl .sw{width:40px;height:24px;border-radius:12px;background:var(--line);position:relative;flex:none;transition:background .15s}
.urgent-tgl .sw::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.urgent-tgl.on{border-color:var(--bad);background:var(--bad-l);color:var(--bad)}
.urgent-tgl.on small{color:inherit;opacity:.85}
.urgent-tgl.on .sw{background:var(--bad)}.urgent-tgl.on .sw::after{left:19px}

/* ---------- занятость ---------- */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.person{padding:10px 12px;display:flex;gap:10px;align-items:center;min-width:0}
.person .nm{font-weight:600}
.person .st{font-size:12px;color:var(--muted)}
.person .over{color:var(--bad);font-weight:600}
.tl-nav{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.tl-nav .lbl{font-weight:600;margin-right:auto}
.btn{height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--blue)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--on)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.tl{overflow-x:auto;position:relative}
.tl-inner{position:relative}
.tl-head{display:flex;position:sticky;top:0;background:var(--card);z-index:3;border-bottom:1px solid var(--line)}
.tl-name{position:sticky;left:0;z-index:2;background:var(--card);flex:none;border-right:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 10px;font-weight:600;font-size:14px}
.tl-day{flex:none;text-align:center;font-size:11px;color:var(--muted);padding:6px 0 4px;border-left:1px solid transparent}
.tl-day b{display:block;font-size:13px;color:var(--ink);font-weight:600}
.tl-day.we{background:var(--card2)}
.tl-day.today b{color:var(--on);background:var(--blue);border-radius:10px;width:24px;margin:0 auto}
.tl-row{display:flex;position:relative;border-bottom:1px solid var(--line)}
.tl-row:last-child{border-bottom:0}
.tl-lane{position:relative;flex:none}
.tl-bg{position:absolute;top:0;bottom:0;display:flex}
.tl-bg span{flex:none;height:100%}
.tl-bg span.we{background:var(--card2)}
.bar{position:absolute;height:24px;border-radius:7px;font-size:12px;font-weight:600;color:var(--on);padding:0 8px;display:flex;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:0;z-index:1}
.bar.un{background:var(--line);background:color-mix(in srgb,var(--muted) 45%,transparent);color:var(--ink);border:1px dashed var(--muted);font-weight:700;padding:0 6px}
.tl-row.un-row{border-top:2px solid var(--line)}
.tl-name.un-name{flex-direction:column;align-items:flex-start;justify-content:center;gap:0;color:var(--muted)}
.tl-name.un-name small{font-weight:400;font-size:11px}
.bar.open-end{background-image:linear-gradient(90deg,transparent 70%,rgba(255,255,255,.35))}
.bar:hover{filter:brightness(1.08)}
.load{position:absolute;left:0;bottom:3px;height:4px;display:flex}
.load span{flex:none;height:4px;border-radius:2px;margin:0 1px}
.todayline{position:absolute;top:0;bottom:0;width:2px;background:var(--orange);z-index:2;pointer-events:none}
.nodates{margin-top:12px;font-size:13px;color:var(--muted)}
.nodates button{border:0;background:none;color:var(--blue);padding:0;text-decoration:underline;text-underline-offset:2px}

/* ---------- логотип ---------- */
.logo{border-radius:50%;flex:none;display:block;background:#fff}
.side .logo{box-shadow:0 0 0 2px rgba(255,255,255,.9)}
.top-logo{box-shadow:0 0 0 2px rgba(255,255,255,.9)}

/* ---------- план на неделю ---------- */
.mode-seg{margin-bottom:14px}
.mode-seg button{height:38px;padding:0 16px;font-size:14px}
.tl-nav .lbl small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.wk-sum{display:flex;flex-wrap:wrap;gap:8px 18px;margin:2px 2px 14px;font-size:14px;color:var(--muted)}
.wk-sum b{color:var(--ink);font-size:17px}.wk-sum .bad,.wk-sum .bad b{color:var(--bad)}
.wk-grid{display:grid;gap:12px}
@media (min-width:1100px){.wk-grid{grid-template-columns:repeat(2,1fr)}}
.wk-card{padding:0;overflow:hidden}
.wk-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--card2)}
.wk-head .ava{width:34px;height:34px;font-size:15px}
.wk-head .nm{font-weight:700;font-size:16px}.wk-head .st{font-size:13px;color:var(--muted)}
.wk-head .over{color:var(--bad);font-weight:600}
.wk-daysrow{display:flex;justify-content:flex-end;padding:8px 14px 0}
.wk-cells{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;width:196px;flex:none}
.wk-cells span{height:10px;border-radius:3px;background:var(--card2);border:1px solid var(--line)}
.wk-cells span.we{opacity:.6}
.wk-cells span.on{background:var(--blue);border-color:var(--blue)}
.wk-cells span.bad{background:var(--bad);border-color:var(--bad)}
.wk-cells span.due{box-shadow:0 0 0 2px var(--orange);position:relative;z-index:1}
.wk-cells span.today:not(.on):not(.bad){border-color:var(--orange)}
.wk-cells.head span{height:auto;background:none;border:0;font-size:11px;color:var(--muted);text-align:center;line-height:1.1}
.wk-cells.head span b{display:block;font-size:13px;color:var(--ink)}
.wk-cells.head span.today b{color:var(--orange)}
.wk-item{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:11px 14px}
.wk-item:last-of-type{border-bottom:0}
.wk-item:hover{background:var(--blue-l)}
.wk-top{display:flex;align-items:baseline;gap:10px;min-width:0}
.wk-top .num{font-size:22px;font-weight:800;line-height:1.05;color:var(--blue);white-space:nowrap;font-variant-numeric:tabular-nums}
.wk-top .num small{font-size:13px;font-weight:700;opacity:.6}
.wk-top .num.none{font-size:15px;color:var(--muted)}
.wk-title{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wk-bot{display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap}
.wk-start{font-size:13px;font-weight:600;color:var(--ink);margin-right:auto;white-space:nowrap}
.wk-start::before{content:"▶";font-size:10px;color:var(--blue);margin-right:6px}
.wk-bot .pill{max-width:100%;overflow:hidden;text-overflow:ellipsis}
.wk-empty{padding:16px 14px;color:var(--muted);font-size:14px}
.wk-lg{display:inline-block;width:14px;height:10px;border-radius:3px;background:var(--card2);border:1px solid var(--line)}
.wk-lg.on{background:var(--blue);border-color:var(--blue)}.wk-lg.bad{background:var(--bad);border-color:var(--bad)}
.wk-lg.due{box-shadow:0 0 0 2px var(--orange)}.wk-lg.today{border-color:var(--orange)}
@media (max-width:420px){.wk-cells{width:100%}.wk-bot .pill{margin-right:0}}

/* ---------- шторка ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,20,35,.45);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:51;left:0;right:0;bottom:0;max-height:92vh;background:var(--card);border-radius:20px 20px 0 0;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .25s ease}
.sheet.on{transform:none}
@media (min-width:900px){
  .sheet{left:auto;top:0;width:480px;max-height:none;border-radius:0;transform:translateX(105%)}
}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0}
@media (min-width:900px){.sheet .grab{display:none}}
.sh-head{display:flex;align-items:flex-start;gap:10px;padding:14px 18px 10px;border-bottom:1px solid var(--line)}
.sh-head h2{margin:0;font-size:18px;flex:1}
.sh-head .sub{font-size:13px;color:var(--muted);margin-top:2px}
.sh-head .x{width:36px;height:36px;border-radius:10px;border:0;background:var(--card2);display:grid;place-items:center;color:var(--muted)}
.sh-body{overflow-y:auto;padding:14px 18px;flex:1}
.sh-foot{display:flex;gap:10px;padding:12px 18px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.sh-foot .btn{height:44px;flex:1;justify-content:center;font-weight:600}
.banner{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;margin-bottom:14px;font-size:14px}
.banner.ok{background:var(--ok-l);color:var(--ok)}.banner.bad{background:var(--bad-l);color:var(--bad)}
.banner.warn{background:var(--warn-l);color:var(--warn)}.banner.info{background:var(--blue-l);color:var(--blue)}
.banner.muted{background:var(--card2);color:var(--muted)}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:5px;text-transform:uppercase;letter-spacing:.03em}
.fld input,.fld select,.fld textarea{width:100%;height:42px;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:0 12px;outline:none}
.fld textarea{height:auto;min-height:70px;padding:10px 12px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-l)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{height:34px;padding:0 12px;border-radius:17px;border:1px solid var(--line);background:var(--card);font-size:13px;display:inline-flex;align-items:center;gap:6px}
.seg button.on{background:var(--blue);border-color:var(--blue);color:var(--on)}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:20px}
.stepper input{text-align:center;width:70px!important}
.date-hl input{border-color:var(--blue)}
.sheetlink{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--blue);text-decoration:none;margin-top:4px}

/* ---------- тост ---------- */
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 20px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#1d2733;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;opacity:0;transition:.2s;pointer-events:none;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.err{background:var(--bad)}
@media (min-width:900px){.toast{bottom:24px}}

/* ---------- чат ---------- */
img.ava{object-fit:cover;background:var(--card2)}
.bnav button,.side nav button{position:relative}
.nb{position:absolute;top:6px;left:calc(50% + 4px);min-width:20px;height:20px;padding:0 4px;border-radius:10px;background:var(--orange);color:#fff;border:2px solid var(--card);font-size:11px;font-weight:700;font-style:normal;line-height:16px;text-align:center}
@media (min-width:900px){.nb{top:50%;left:auto;right:12px;margin-top:-10px;border-color:var(--blue-d)}}
.ch-item.unread{background:var(--warn-l);box-shadow:inset 4px 0 0 var(--orange)}
.ch-item.unread .t1>span{font-weight:800}
.ch-item.unread .t1 small{color:var(--orange);font-weight:700}
.ch-item.unread .t2{color:var(--ink);font-weight:600}
.ch-item .unr{width:14px;height:14px}
.ch-msg .who .pos{font-weight:400;font-size:12px;color:var(--muted);background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:0 7px;margin-left:8px}
.mem-row{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.mem-row .mem{border-bottom:0;flex:1;min-width:0}
.ch-ico{font-weight:700}
.ava-btn{border:0;background:none;padding:0;cursor:pointer;border-radius:50%;flex:none;display:block;height:44px}
.ch-msg .ava-btn .ava{display:grid}
.ch-item .ch-av{width:46px;height:46px;font-size:19px}
.ch-sec{padding:10px 14px 4px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;background:var(--card2)}
.ch-hint{padding:8px 14px 12px;font-size:13px;color:var(--muted)}
.mem{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 4px}
.mem:hover{background:var(--blue-l)}
.mem .ava{width:44px;height:44px;font-size:19px}
.mem small{display:block;color:var(--muted);font-size:13px}
.view-chat .fab{display:none}
.chat{display:grid;grid-template-columns:1fr;height:calc(100vh - 172px);height:calc(100dvh - 172px);min-height:380px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.ch-list,.ch-conv{display:flex;flex-direction:column;min-height:0;min-width:0}
.chat:not(.show-conv) .ch-conv{display:none}
.chat.show-conv .ch-list{display:none}
@media (min-width:900px){
  .chat{grid-template-columns:290px 1fr;height:calc(100vh - 150px)}
  .chat:not(.show-conv) .ch-conv,.chat.show-conv .ch-list{display:flex}
  .ch-back{display:none!important}
}
.ch-list{border-right:1px solid var(--line);background:var(--card2)}
.ch-me{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--card)}
.ch-me .ava{width:44px;height:44px;font-size:19px}
.ch-me .nm{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch-me .nm small{display:block;font-weight:400;font-size:13px;color:var(--muted)}
.ch-items{flex:1;overflow-y:auto}
.ch-item{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 14px}
.ch-item:hover{background:var(--blue-l)}
.ch-item.on{background:var(--blue-l);box-shadow:inset 3px 0 0 var(--blue)}
.ch-ic{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--blue);color:var(--on);font-weight:700;font-size:15px;flex:none}
.ch-ic.gen{background:var(--orange)}
.ch-item .tx{flex:1;min-width:0}
.ch-item .t1{display:flex;gap:8px;align-items:baseline;font-weight:600;font-size:16px}
.ch-item .t1 span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch-item .t1 small{flex:none;font-weight:400;color:var(--muted);font-size:13px}
.ch-item .t2{font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch-item .unr{width:10px;height:10px;border-radius:50%;background:var(--orange);flex:none}
.ch-add{padding:10px 12px;border-top:1px solid var(--line)}
.ch-add .sel{width:100%}
.ch-head{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);min-height:58px}
.ch-head .tt{flex:1;min-width:0;font-size:17px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch-head .tt small{display:block;font-weight:400;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis}
.ch-ico{width:36px;height:36px;border-radius:10px;border:0;background:var(--card2);color:var(--muted);display:grid;place-items:center;flex:none}
.ch-back{width:36px;height:36px;border-radius:10px;border:0;background:var(--card2);color:var(--muted);display:grid;place-items:center;flex:none}
.ch-msgs{flex:1;min-height:0;overflow-y:auto;padding:10px 14px;display:flex;flex-direction:column}
.ch-day{align-self:center;font-size:12px;color:var(--muted);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:2px 10px;margin:12px 0 6px}
.ch-msg{display:flex;gap:10px;padding:1px 0;position:relative}
.ch-msg.first{margin-top:10px}
.ch-msg .ava,.ch-msg .sp{width:44px;height:44px;font-size:19px;flex:none}
.ch-msg .bd{min-width:0;flex:1}
.ch-msg .who{font-weight:600;font-size:16px}
.ch-msg .who small{font-weight:400;color:var(--muted);margin-left:8px;font-size:13px}
.ch-msg .tx{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.45;font-size:16px}
.ch-msg .tx a{color:var(--blue)}
.ch-msg.pending .tx{opacity:.6}
.ch-msg .del{position:absolute;right:0;top:0;width:28px;height:28px;border:0;border-radius:8px;background:var(--card);color:var(--muted);display:grid;place-items:center;opacity:0}
.ch-msg:hover .del,.ch-msg .del:focus{opacity:1}
@media (hover:none){.ch-msg .del{opacity:.5}}
.ch-empty{margin:auto;text-align:center;color:var(--muted);padding:20px}
.ch-compose{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);align-items:flex-end}
.ch-compose textarea{flex:1;min-width:0;height:42px;max-height:140px;resize:none;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:10px 12px;outline:none;line-height:1.35;font-size:16px}
.ch-compose textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-l)}
.ch-compose button{width:44px;height:42px;border-radius:12px;border:0;background:var(--blue);color:var(--on);display:grid;place-items:center;flex:none}
.ch-auth{max-width:440px;margin:24px auto;padding:22px}
.ch-auth h2{margin:0 0 6px;font-size:20px}
.ch-auth p{color:var(--muted);margin:6px 0 14px}
.ch-auth ol{margin:8px 0 14px;padding-left:20px;color:var(--muted)}
.ch-auth .btn{width:100%;justify-content:center;height:44px;font-weight:600;margin-top:4px}
.ch-auth .link{border:0;background:none;color:var(--blue);padding:8px 0;text-decoration:underline;text-underline-offset:2px;width:100%}
.ch-conv{position:relative}
.ch-conv.drop::after{content:"Отпустите, чтобы отправить файл";position:absolute;inset:0;z-index:6;display:grid;place-items:center;background:rgba(31,92,153,.14);border:3px dashed var(--blue);border-radius:var(--radius);color:var(--blue);font-weight:700;font-size:18px;pointer-events:none}
.ch-up{padding:6px 14px;font-size:13px;color:var(--blue);background:var(--blue-l);border-top:1px solid var(--line)}
.ch-up[hidden]{display:none}
.ch-up.err{color:var(--bad);background:var(--bad-l);cursor:pointer;font-weight:600}
.ch-compose .ch-ico{align-self:flex-end;height:42px;width:42px;border-radius:12px;background:var(--card2);color:var(--muted);border:1px solid var(--line)}
.att{margin-top:6px;max-width:420px}
.att-img img{display:block;max-width:100%;max-height:300px;border-radius:10px;border:1px solid var(--line);background:var(--card2)}
.att-dl{display:inline-block;margin-top:3px;font-size:12px;color:var(--blue)}
.att-file{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--card2);flex-wrap:wrap}
.att-ic{color:var(--muted);flex:none;display:grid}
.att-nm{flex:1;min-width:120px}.att-nm b{display:block;font-size:14px;overflow-wrap:anywhere}.att-nm small{color:var(--muted);font-size:12px}
.att-file .btn{height:32px;font-size:13px;text-decoration:none;padding:0 10px}
.rxs{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.rx{height:32px;padding:0 11px;border-radius:16px;border:1px solid var(--line);background:var(--card2);font-size:15px;display:inline-flex;align-items:center;gap:5px}
.rx-add{height:32px;min-width:40px;padding:0 10px;border-radius:16px;border:1px dashed var(--muted);background:none;color:var(--muted);font-size:20px;line-height:1;opacity:.55;display:inline-flex;align-items:center;justify-content:center}
.rx-add:hover,.rx-add:focus{opacity:1;border-color:var(--blue);color:var(--blue);background:var(--blue-l)}
.ch-msg:hover .rx-add{opacity:1}
@media (hover:none){.rx-add{opacity:1}}
.rx.on{background:var(--blue-l);border-color:var(--blue);color:var(--blue);font-weight:700}
.rx-pick{display:inline-flex;gap:4px;margin-top:6px;padding:4px 6px;border:1px solid var(--line);border-radius:18px;background:var(--card);box-shadow:var(--shadow)}
.rx-pick{padding:5px 8px;gap:6px}
.rx-pick button{width:44px;height:44px;border:0;border-radius:50%;background:none;font-size:26px;line-height:1}
.rx-pick button:hover{background:var(--blue-l)}
.react{position:absolute;right:32px;top:0;width:28px;height:28px;border:0;border-radius:8px;background:var(--card);color:var(--muted);font-size:16px;display:grid;place-items:center;opacity:0}
.ch-msg:hover .react,.ch-msg .react:focus{opacity:1}
@media (hover:none){.react{opacity:.5}}
.ch-read{margin-top:4px;font-size:12px;color:var(--muted)}
.ch-read.ok{color:var(--ok)}
.ch-mn{position:absolute;left:12px;right:12px;bottom:66px;z-index:5;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);max-height:240px;overflow-y:auto}
.ch-mn[hidden]{display:none}
.ch-mn button{font-size:16px;display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:8px 12px}
.ch-mn button.on,.ch-mn button:hover{background:var(--blue-l)}
.ch-mn .ava{width:34px;height:34px;font-size:15px}
.mention{color:var(--blue);background:var(--blue-l);border-radius:5px;padding:0 3px;font-weight:600}
.mention.me{color:var(--on);background:var(--orange)}
.ch-msg.ment{background:var(--warn-l);border-radius:8px;box-shadow:-10px 0 0 var(--warn-l),inset 3px 0 0 var(--orange);padding-left:6px;margin-left:-6px}
.nb.m,.ch-item .unr.m{background:var(--bad)}
.ch-item .unr.m{width:auto;height:18px;min-width:18px;border-radius:9px;color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.pf-sec{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin:4px 0 6px}
.pf-chk{display:flex;gap:10px;align-items:center;margin:10px 0 14px;font-size:14px}
.pf-chk input{width:18px;height:18px}
.ava-big{width:84px!important;height:84px!important;font-size:34px!important}
.pf-ava{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.pf-ava .btns{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
</style>

const DAY = 864e5;
function today() { const d = new Date(); d.setHours(0,0,0,0); return d; }
function pd(s) { if (!s) return null; const m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? new Date(+m[1], m[2]-1, +m[3]) : null; }
function iso(d) { return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }

function fd(s, withYear) { const d = pd(s); if (!d) return '—'; const r = String(d.getDate()).padStart(2,'0') + '.' + String(d.getMonth()+1).padStart(2,'0'); return withYear ? r + '.' + String(d.getFullYear()).slice(2) : r; }

function avaColor(n) { const i = STAFF.indexOf(n); if (i >= 0) return AVA_COLORS[i]; let h = 0; for (const c of n) h = (h * 31 + c.charCodeAt(0)) >>> 0; return AVA_COLORS[h % AVA_COLORS.length]; }

// Статус и отклонение — те же правила, что в Code.gs → writeComputed_
function info(r) {
  const t = today(), due = pd(r.due), sub = pd(r.submitted), con = pd(r.contract);
  let res;
  if (r.stage === 'Сдано') res = {key:'done', label:'Сдано', tone:'ok'};
  else if (due && sub) {
    const dev = diff(sub, due);
    res = dev > 0 ? {key:'late', label:`Сдано +${dev} дн.`, tone:'warn', dev} : {key:'ontime', label: dev < 0 ? `Сдано на ${-dev} дн. раньше` : 'Сдано в срок', tone:'ok', dev};
  } else if (due) {
    const left = diff(due, t);
    if (left < 0) res = {key:'overdue', label:`Просрочено ${-left} дн.`, tone:'bad', dev:-left, left};
    else if (left === 0) res = {key:'hot', label:'Срок сегодня', tone:'warn', left};
    else if (left <= 2) res = {key:'hot', label:`Через ${left} дн.`, tone:'warn', left};
    else res = {key:'work', label:`Через ${left} дн.`, tone:'info', left};
  } else if (sub) res = {key:'submitted', label:`Сдано ${fd(r.submitted)}`, tone:'ok'};
  else res = {key:'nodue', label:'Без срока', tone:'muted'};
  // договорный срок
  if (con && r.stage !== 'Сдано') {
    if (due && due > con) res.contractWarn = `Срок ${fd(r.due)} позже договорного ${fd(r.contract)}`;
    else if (!sub && con < t) res.contractWarn = `Договорной срок ${fd(r.contract, 1)} прошёл`;
  }
  return res;
}
const isActive = r => r.stage !== 'Сдано';
// «Срочная» подсвечивается, пока работа не сдана
const isUrgent = r => !!r.urgent && isActive(r);

// Строка «Договор до …» для карточки: красная — срок прошёл, жёлтая — осталось ≤ 7 дней
function contractLine(r) {
  const con = pd(r.contract);
  if (!con) return r.stage === 'Сдано' ? '' : `<span class="contract none" title="Крайняя дата по договору не указана">${IC.cal}Договор: дата не указана</span>`;
  const left = diff(con, today());
  let tone = '', hint = '';
  if (isActive(r)) {
    hint = left < 0 ? ` (прошло ${-left} дн.)` : left === 0 ? ' (сегодня)' : ` (через ${left} дн.)`;
    if (!pd(r.submitted)) tone = left < 0 ? 'bad' : left <= 7 ? 'warn' : '';
  }
  return `<span class="contract ${tone}" title="Крайняя дата по договору: ${fd(r.contract, 1)}${hint}">${IC.cal}Договор до ${fd(r.contract, 1)}</span>`;
}

async function load(silent) {
  if (!S.cfg.url) {
    S.mode = 'demo';
    S.rows = lsGet(LS.demo, null) || structuredClone(DEMO);
    S.updated = null; renderAll(); openPendingTask(); return;
  }
  setBusy(true);
  try {
    const res = await fetch(S.cfg.url + (S.cfg.url.includes('?') ? '&' : '?') + 'action=list', {redirect:'follow'});
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'Ошибка сервера');
    S.rows = data.rows; S.mode = 'live'; S.updated = new Date();
    lsSet(LS.cache, {rows: S.rows, updated: S.updated.toISOString()});
  } catch (e) {
    const c = lsGet(LS.cache, null);
    if (c) { S.rows = c.rows; S.updated = new Date(c.updated); }
    S.mode = 'offline';
    if (!silent) toast('Нет связи с таблицей: ' + e.message, true);
  } finally { setBusy(false); renderAll(); openPendingTask(); }
}

// Ссылка …/index.html?task=12 открывает карточку задачи (строка 12 реестра)
function openPendingTask() {
  if (!S.pendingTask) return;
  const id = S.pendingTask; S.pendingTask = null;
  if (S.rows.some(r => r.id === id)) openSheet(id);
}

async function api(body) {
  const res = await fetch(S.cfg.url, {method:'POST', redirect:'follow', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({...body, key: S.cfg.key, app: location.origin + location.pathname, actor: CHAT.user ? {uid: CHAT.user.uid, name: userName(CHAT.user.uid)} : null})});
  const data = await res.json();
  if (!data.ok) throw new Error(data.error || 'Ошибка сервера');
  return data.row;
}

// Оптимистичное сохранение: сразу показываем, при ошибке откатываем.
async function saveRow(id, fields) {
  const i = S.rows.findIndex(r => r.id === id);
  if (i < 0 || !Object.keys(fields).length) return;
  const prev = S.rows[i];
  S.rows[i] = {...prev, ...fields};
  renderAll();
  if (S.mode === 'demo') { lsSet(LS.demo, S.rows); toast('Сохранено (демо)'); return; }
  try {
    const row = await api({action:'update', id, fields});
    const j = S.rows.findIndex(r => r.id === id);
    if (j >= 0) S.rows[j] = row;
    lsSet(LS.cache, {rows: S.rows, updated: new Date().toISOString()});
    toast('Сохранено в таблицу'); renderAll();
  } catch (e) {
    const j = S.rows.findIndex(r => r.id === id);
    if (j >= 0) S.rows[j] = prev;
    renderAll(); toast('Не сохранено: ' + e.message, true);
  }
}

async function createRow(fields) {
  if (S.mode === 'demo') {
    const id = Math.max(2, ...S.rows.map(r => r.id)) + 1;
    S.rows.push({id, num:'', client:'', object:'', contract:null, stage:'', owner:'', assigned:null, due:null, comment:'', submitted:null, edits:null, priority:null, urgent:false, ...fields});
    lsSet(LS.demo, S.rows); renderAll(); toast('Проект добавлен (демо)'); return true;
  }
  try {
    const row = await api({action:'create', fields});
    S.rows.push(row); renderAll(); toast('Проект добавлен в таблицу'); return true;
  } catch (e) { toast('Не добавлено: ' + e.message, true); return false; }
}

/* ================== Обзор ================== */
function urgencyRank(r) {
  const k = info(r).key;
  const order = {overdue:0, hot:1, work:2, nodue:3, submitted:4, late:4, ontime:5, done:6};
  const d = pd(r.due);
  return [isUrgent(r) ? -1 : (order[k] ?? 3), d ? d.getTime() : 9e15]; // срочные — всегда наверху
}
function filtered() {
  const f = S.f, q = f.q.trim().toLowerCase();
  let rows = S.rows.filter(r => {
    if (q && ![r.num, r.client, r.object, r.owner, r.comment].join(' ').toLowerCase().includes(q)) return false;
    if (f.stage && (r.stage || '') !== f.stage) return false;
    if (f.owner && (r.owner || '') !== f.owner) return false;
    if (f.tile) {
      const k = info(r).key;
      if (f.tile === 'active' && !isActive(r)) return false;
      if (f.tile === 'overdue' && k !== 'overdue') return false;
      if (f.tile === 'hot' && k !== 'hot') return false;
      if (f.tile === 'review' && r.stage !== 'На согласовании') return false;
      if (f.tile === 'edits' && !r.edits) return false;
    }
    return true;
  });
  const cmpNum = (a, b) => (parseFloat(b.num) || 0) - (parseFloat(a.num) || 0);
  if (f.sort === 'urgency') rows.sort((a, b) => { const x = urgencyRank(a), y = urgencyRank(b); return x[0] - y[0] || x[1] - y[1] || cmpNum(a, b); });
  if (f.sort === 'priority') rows.sort((a, b) => (a.priority ?? 9) - (b.priority ?? 9) || cmpNum(a, b));
  if (f.sort === 'num') rows.sort(cmpNum);
  return rows;
}
function owners() {
  const set = new Set(STAFF);
  S.rows.forEach(r => r.owner && set.add(r.owner));
  return [...set];
}
function renderOverview() {
  const rows = S.rows, act = rows.filter(isActive);
  const cnt = k => act.filter(r => info(r).key === k).length;
  const tiles = [
    {k:'active', n:act.length, l:'В работе', c:'var(--blue)'},
    {k:'overdue', n:cnt('overdue'), l:'Просрочено', c:'var(--bad)'},
    {k:'hot', n:cnt('hot'), l:'Горят (≤ 2 дн.)', c:'var(--orange)'},
    {k:'review', n:rows.filter(r => r.stage === 'На согласовании').length, l:'На согласовании', c:'var(--st4)'},
    {k:'edits', n:rows.reduce((s, r) => s + (r.edits || 0), 0), l:'Правок от заказчиков', c:'var(--st5)'}
  ];
  const byStage = STAGES.filter(s => s !== 'Сдано').map(s => ({s, n: rows.filter(r => r.stage === s).length}));
  const noStage = act.filter(r => !r.stage).length;
  const total = act.length || 1; // «Сдано» — архив, в диаграмму не входит
  const list = filtered();
  const f = S.f;
  $('#v-overview').innerHTML = `
    <div class="tiles">${tiles.map(t => `<button class="tile ${f.tile === t.k ? 'on' : ''}" data-tile="${t.k}" style="--c:${t.c}"><div class="n">${t.n}</div><div class="l">${t.l}</div></button>`).join('')}</div>
    <div class="card" style="padding:14px 16px;margin-top:14px">
      <div style="display:flex;justify-content:space-between;font-weight:600">Проекты по стадиям<span style="color:var(--muted);font-weight:400">${act.length} в работе</span></div>
      <div class="stagebar">${byStage.map(x => x.n ? `<span style="width:${x.n / total * 100}%;background:${stageColor(x.s)}" title="${x.s}: ${x.n}"></span>` : '').join('')}${noStage ? `<span style="width:${noStage / total * 100}%;background:var(--line)" title="Без стадии: ${noStage}"></span>` : ''}</div>
      <div class="legend">${byStage.map(x => `<span><i class="dot" style="background:${stageColor(x.s)}"></i>${x.s} <b>${x.n}</b></span>`).join('')}${noStage ? `<span><i class="dot" style="background:var(--line)"></i>Без стадии <b>${noStage}</b></span>` : ''}</div>
    </div>
    <div class="tools">
      <label class="search">${IC.search}<input id="q" type="search" placeholder="Номер, заказчик, объект…" value="${esc(f.q)}"></label>
      <select class="sel" id="fOwner"><option value="">Все сотрудники</option>${owners().map(o => `<option ${f.owner === o ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>
      <select class="sel" id="fSort">
        <option value="urgency" ${f.sort === 'urgency' ? 'selected' : ''}>Сначала срочные</option>
        <option value="priority" ${f.sort === 'priority' ? 'selected' : ''}>По приоритету</option>
        <option value="num" ${f.sort === 'num' ? 'selected' : ''}>По номеру</option>
      </select>
    </div>
    <div class="chips">
      <button class="chip ${!f.stage ? 'on' : ''}" data-stage="">Все стадии</button>
      ${STAGES.map(s => `<button class="chip ${f.stage === s ? 'on' : ''}" data-stage="${s}"><span class="dot" style="background:${stageColor(s)}"></span>${s}</button>`).join('')}
    </div>
    <div class="list">${list.map(r => taskCard(r, {stage:true})).join('') || '<div class="empty">Ничего не найдено</div>'}</div>`;
}

/* ================== Канбан ================== */
function renderKanban() {
  const cols = [...STAGES];
  if (S.rows.some(r => !r.stage)) cols.unshift('');
  const canDrag = matchMedia('(pointer:fine)').matches;
  const sorter = (a, b) => { const x = urgencyRank(a), y = urgencyRank(b); return x[0] - y[0] || x[1] - y[1]; };
  $('#v-kanban').innerHTML = `<div class="board">${cols.map(s => {
    const items = S.rows.filter(r => (r.stage || '') === s).sort(sorter);
    return `<div class="col" data-col="${esc(s)}">
      <h3><span class="dot" style="background:${s ? stageColor(s) : 'var(--line)'}"></span>${esc(s || 'Без стадии')}<span class="cnt">${items.length}</span></h3>
      ${items.map(r => taskCard(r, {drag: canDrag})).join('') || '<div class="empty" style="padding:16px;font-size:13px">Пусто</div>'}
    </div>`;
  }).join('')}</div>
  <p style="color:var(--muted);font-size:13px;margin-top:10px">${canDrag ? 'Перетащите карточку в другую колонку, чтобы сменить стадию.' : 'Откройте карточку, чтобы сменить стадию.'}</p>`;
}

/* ================== Занятость ================== */
const DAY_W = 34, LANE_H = 30;
const WD = ['вс','пн','вт','ср','чт','пт','сб'];

// период задачи: от начала работы до срока (или договора)
function span(r) {
  const a = pd(r.assigned), b = pd(r.due) || pd(r.contract);
  if (!a && !b) return null;
  const s = a || b, e = b && b >= s ? b : s;
  return {s, e, openEnd: !pd(r.due)};
}
function loadPeople(act) {
  const people = owners().filter(o => STAFF.includes(o) || act.some(r => r.owner === o));
  if (act.some(r => !r.owner)) people.push('');
  return people;
}

function renderLoad() {
  const m = S.loadMode;
  $('#v-load').innerHTML = `
    <div class="seg mode-seg">
      <button type="button" data-lmode="week" class="${m === 'week' ? 'on' : ''}">План на неделю</button>
      <button type="button" data-lmode="timeline" class="${m === 'timeline' ? 'on' : ''}">Шкала сроков</button>
    </div>
    <div id="loadBody"></div>`;
  if (m === 'week') renderWeek(); else renderTimeline();
}

/* ---- План на неделю ---- */
function renderWeek() {
  const t = today();
  const mon = new Date(t); mon.setDate(t.getDate() - (t.getDay() + 6) % 7 + 7 * S.weekOff);
  const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
  const days = Array.from({length: 7}, (_, i) => { const d = new Date(mon); d.setDate(mon.getDate() + i); return d; });
  const act = S.rows.filter(isActive);
  const people = loadPeople(act);

  const plan = people.map(o => {
    const mine = act.filter(r => (r.owner || '') === o);
    const items = [], noDate = [];
    mine.forEach(r => {
      const sp = span(r), inf = info(r);
      if (!sp) { noDate.push(r); return; }
      const inWeek = sp.s <= sun && sp.e >= mon;
      const carry = inf.key === 'overdue' && sp.e < mon && S.weekOff >= 0; // просрочка переходит в план
      if (!inWeek && !carry) return;
      const due = pd(r.due);
      let tag;
      if (inf.key === 'overdue') tag = {tone:'bad', t:`Просрочено с ${fd(r.due)}`};
      else if (due && due >= mon && due <= sun) tag = {tone: diff(due, t) <= 2 && diff(due, t) >= 0 ? 'warn' : 'info', t:`Сдача ${WD[due.getDay()]} ${fd(r.due)}`, due:true};
      else if (sp.openEnd) tag = {tone:'muted', t: r.contract ? `Срок не задан · дог. ${fd(r.contract)}` : 'Срок не задан'};
      else if (due && due > sun) tag = {tone:'info', t:`В работе до ${fd(r.due)}`};
      else tag = {tone: inf.tone, t: inf.label};
      items.push({r, sp, tag, carry, inf});
    });
    const rank = x => x.inf.key === 'overdue' ? 0 : x.tag.due ? 1 : 2;
    items.sort((a, b) => rank(a) - rank(b) || a.sp.e - b.sp.e);
    return {o, items, noDate, dues: items.filter(x => x.tag.due).length, over: items.filter(x => x.inf.key === 'overdue').length};
  });

  const cells = x => days.map(d => {
    const on = x.carry || (d >= x.sp.s && d <= x.sp.e);
    const isDue = x.r.due && +d === +pd(x.r.due);
    const cls = [on ? (x.inf.key === 'overdue' ? 'bad' : 'on') : '', isDue ? 'due' : '', +d === +t ? 'today' : '', d.getDay() % 6 === 0 ? 'we' : ''].join(' ');
    return `<span class="${cls}" title="${WD[d.getDay()]} ${d.getDate()}${isDue ? ' — срок сдачи' : ''}"></span>`;
  }).join('');

  const fmt = d => d.toLocaleDateString('ru-RU', {day:'numeric', month:'long'});
  const wLabel = S.weekOff === 0 ? 'Эта неделя' : S.weekOff === 1 ? 'Следующая неделя' : S.weekOff === -1 ? 'Прошлая неделя' : (S.weekOff > 0 ? 'Через ' + S.weekOff + ' нед.' : S.weekOff + ' нед.');
  const tot = plan.reduce((a, p) => ({n: a.n + p.items.length, d: a.d + p.dues, o: a.o + p.over}), {n:0, d:0, o:0});

  $('#loadBody').innerHTML = `
    <div class="tl-nav">
      <span class="lbl">${wLabel}<small>${fmt(mon)} — ${fmt(sun)}</small></span>
      <button class="btn" data-week="-1" aria-label="Неделя назад">${IC.l}</button>
      <button class="btn" data-week="0">Сегодня</button>
      <button class="btn" data-week="1" aria-label="Неделя вперёд">${IC.r}</button>
    </div>
    <div class="wk-sum">
      <span><b>${tot.n}</b> задач в плане</span><span><b>${tot.d}</b> сдач на неделе</span>${tot.o ? `<span class="bad"><b>${tot.o}</b> просрочено</span>` : ''}
    </div>
    <div class="wk-grid">${plan.map(p => `
      <div class="card wk-card">
        <div class="wk-head">${ava(p.o)}<div style="min-width:0;flex:1"><div class="nm">${esc(p.o || 'Не назначено')}</div>
          <div class="st">${p.items.length} в плане · ${p.dues} ${p.dues === 1 ? 'сдача' : 'сдач'}${p.over ? ` · <span class="over">${p.over} просроч.</span>` : ''}</div></div>
          ${p.items.length >= 5 || p.dues >= 3 ? '<span class="pill warn">плотная неделя</span>' : ''}</div>
        ${p.items.length ? `<div class="wk-daysrow"><span></span><div class="wk-cells head">${days.map(d => `<span class="${+d === +t ? 'today' : ''}">${WD[d.getDay()]}<b>${d.getDate()}</b></span>`).join('')}</div></div>` : ''}
        ${p.items.map(x => `
          <button class="wk-item${isUrgent(x.r) ? ' urgent' : ''}" data-open="${x.r.id}">
            <span class="wk-top">${isUrgent(x.r) ? `<span class="pill urgent-pill" title="Срочная работа">${IC.bolt}Срочно</span>` : ''}${x.r.num ? `<span class="num"><small>№</small>${esc(x.r.num)}</span>` : '<span class="num none">без №</span>'}<span class="wk-title">${esc(x.r.object || x.r.client || '(без названия)')}</span></span>
            <span class="wk-bot"><span class="pill ${x.tag.tone}">${esc(x.tag.t)}</span><span class="wk-start">${x.r.assigned ? 'Начало ' + fd(x.r.assigned, 1) : 'Начало не задано'}</span><span class="wk-cells">${cells(x)}</span></span>
          </button>`).join('') || '<div class="wk-empty">На эту неделю задач по срокам нет</div>'}
        ${p.noDate.length ? `<div class="nodates" style="padding:0 14px 12px">Без дат: ${p.noDate.map(r => `<button data-open="${r.id}">№${esc(r.num || '—')}</button>`).join(', ')}</div>` : ''}
      </div>`).join('')}
    </div>
    <div class="legend" style="margin-top:12px">
      <span><i class="wk-lg on"></i>в работе</span><span><i class="wk-lg due"></i>день сдачи</span><span><i class="wk-lg bad"></i>просрочено</span><span><i class="wk-lg today"></i>сегодня</span>
    </div>`;
}

/* ---- Шкала сроков ---- */
function renderTimeline() {
  const t = today(), NAME_W = innerWidth < 600 ? 104 : 132;
  if (!S.tlStart) { S.tlStart = new Date(t); S.tlStart.setDate(t.getDate() - 7); }
  const start = S.tlStart, days = 35;
  const end = new Date(start); end.setDate(start.getDate() + days - 1);
  const act = S.rows.filter(isActive);
  const people = loadPeople(act);

  const summary = people.map(o => {
    const mine = act.filter(r => (r.owner || '') === o);
    const over = mine.filter(r => info(r).key === 'overdue').length;
    // пиковая одновременная нагрузка в ближайшие 14 дней
    let peak = 0;
    for (let i = 0; i < 14; i++) {
      const d = new Date(t); d.setDate(t.getDate() + i);
      const n = mine.filter(r => { const sp = span(r); return sp && sp.s <= d && d <= sp.e; }).length;
      peak = Math.max(peak, n);
    }
    return {o, mine, over, peak};
  });

  const head = [];
  for (let i = 0; i < days; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const we = d.getDay() === 0 || d.getDay() === 6, isT = +d === +t;
    head.push(`<div class="tl-day ${we ? 'we' : ''} ${isT ? 'today' : ''}" style="width:${DAY_W}px">${['вс','пн','вт','ср','чт','пт','сб'][d.getDay()]}<b>${d.getDate()}</b></div>`);
  }
  const bg = Array.from({length: days}, (_, i) => { const d = new Date(start); d.setDate(start.getDate() + i); const we = d.getDay() === 0 || d.getDay() === 6; return `<span class="${we ? 'we' : ''}" style="width:${DAY_W}px"></span>`; }).join('');

  const rowsHtml = summary.filter(x => x.o !== '').map(({o, mine}) => {
    const items = mine.map(r => ({r, sp: span(r)})).filter(x => x.sp && x.sp.e >= start && x.sp.s <= end).sort((a, b) => a.sp.s - b.sp.s);
    const lanes = [];
    items.forEach(x => { let l = lanes.findIndex(e => e < x.sp.s); if (l < 0) { l = lanes.length; lanes.push(0); } lanes[l] = x.sp.e; x.lane = l; });
    const h = Math.max(1, lanes.length) * LANE_H + 14;
    const bars = items.map(({r, sp, lane}) => {
      const s = sp.s < start ? start : sp.s, e = sp.e > end ? end : sp.e;
      const left = diff(s, start) * DAY_W + 2, width = (diff(e, s) + 1) * DAY_W - 4;
      const inf = info(r);
      const color = inf.tone === 'bad' ? 'var(--bad)' : inf.tone === 'warn' ? 'var(--orange)' : inf.tone === 'ok' ? 'var(--ok)' : stageColor(r.stage);
      return `<button class="bar ${sp.openEnd ? 'open-end' : ''}" data-open="${r.id}" style="left:${left}px;top:${lane * LANE_H + 5}px;width:${width}px;background:${color}" title="№${esc(r.num)} ${esc(r.object)} — ${esc(inf.label)}${sp.openEnd ? ' (срок не задан)' : ''}">${esc(r.num ? r.num + ' · ' : '')}${esc(r.object || r.client)}</button>`;
    }).join('');
    const load = Array.from({length: days}, (_, i) => {
      const d = new Date(start); d.setDate(start.getDate() + i);
      const n = mine.filter(r => { const sp = span(r); return sp && sp.s <= d && d <= sp.e; }).length;
      const c = n >= 3 ? 'var(--bad)' : n === 2 ? 'var(--blue)' : n === 1 ? 'var(--st1)' : 'transparent';
      return `<span style="width:${DAY_W - 2}px;background:${c};opacity:${n === 1 ? .45 : 1}" title="Задач в этот день: ${n}"></span>`;
    }).join('');
    return `<div class="tl-row" style="height:${h}px">
      <div class="tl-name" style="width:${NAME_W}px">${ava(o)}${esc(o || 'Не назначено')}</div>
      <div class="tl-lane" style="width:${days * DAY_W}px"><div class="tl-bg">${bg}</div>${bars}<div class="load">${load}</div></div>
    </div>`;
  }).join('');

  // Не назначенные задачи: серые полоски от даты постановки (или сегодня) до последнего дня договора
  const unPool = act.filter(r => !r.owner && r.stage === 'Готов к проектированию'); // только готовые к проектированию
  const unAll = unPool.map(r => {
    const a = pd(r.assigned), c = pd(r.contract) || pd(r.due);
    if (!c) return null;
    const s = a || t;
    return {r, s, e: c >= s ? c : s, noStart: !a, c};
  }).filter(Boolean);
  const unNoContract = unPool.filter(r => !pd(r.contract) && !pd(r.due));
  const unItems = unAll.filter(x => x.e >= start && x.s <= end).sort((a, b) => a.s - b.s || a.e - b.e);
  const unLanes = [];
  unItems.forEach(x => { let l = unLanes.findIndex(e => e < x.s); if (l < 0) { l = unLanes.length; unLanes.push(0); } unLanes[l] = x.e; x.lane = l; });
  const unBars = unItems.map(x => {
    const s = x.s < start ? start : x.s, e = x.e > end ? end : x.e;
    const left = diff(s, start) * DAY_W + 2, width = (diff(e, s) + 1) * DAY_W - 4;
    const tip = `№${x.r.num || '—'} ${x.r.client || ''} ${x.r.object || ''} — не назначена. ${x.noStart ? 'Дата постановки не указана (с сегодняшнего дня)' : 'С ' + fd(x.r.assigned, 1)} до ${fd(iso(x.c), 1)} (последний день договора)`;
    return `<button class="bar un" data-open="${x.r.id}" style="left:${left}px;top:${x.lane * LANE_H + 5}px;width:${width}px" title="${esc(tip)}">${esc(x.r.num || '—')}</button>`;
  }).join('');
  const unLoad = Array.from({length: days}, (_, i) => {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const n = unAll.filter(x => x.s <= d && d <= x.e).length;
    const c = n >= 3 ? 'var(--bad)' : n === 2 ? 'var(--blue)' : n === 1 ? 'var(--st1)' : 'transparent';
    return `<span style="width:${DAY_W - 2}px;background:${c};opacity:${n === 1 ? .45 : 1}" title="Не назначенных задач в этот день: ${n}"></span>`;
  }).join('');
  const unHtml = unAll.length ? `<div class="tl-row un-row" style="height:${Math.max(1, unLanes.length) * LANE_H + 14}px">
      <div class="tl-name un-name" style="width:${NAME_W}px"><span>Не назначены</span><small>готовы к проект. · ${unAll.length} шт.</small></div>
      <div class="tl-lane" style="width:${days * DAY_W}px"><div class="tl-bg">${bg}</div>${unBars}<div class="load">${unLoad}</div></div>
    </div>` : '';

  const todayLeft = NAME_W + diff(t, start) * DAY_W + DAY_W / 2 - 1;
  const showToday = t >= start && t <= end;
  const noDates = act.filter(r => !span(r));
  const mLabel = start.toLocaleDateString('ru-RU', {day:'numeric', month:'long'}) + ' — ' + end.toLocaleDateString('ru-RU', {day:'numeric', month:'long'});

  $('#loadBody').innerHTML = `
    <div class="people">${summary.map(({o, mine, over, peak}) => `
      <div class="card person">${ava(o)}<div><div class="nm">${esc(o || 'Не назначено')}</div>
      <div class="st">${mine.length} активн.${over ? ` · <span class="over">${over} просроч.</span>` : ''}${peak >= 3 ? ` · <span class="over">перегрузка</span>` : ''}</div></div></div>`).join('')}
    </div>
    <div class="tl-nav">
      <span class="lbl">${mLabel}</span>
      <button class="btn" data-tl="-7" aria-label="Неделя назад">${IC.l}</button>
      <button class="btn" data-tl="0">Сегодня</button>
      <button class="btn" data-tl="7" aria-label="Неделя вперёд">${IC.r}</button>
    </div>
    <div class="card tl"><div class="tl-inner" style="width:${NAME_W + days * DAY_W}px">
      <div class="tl-head"><div class="tl-name" style="width:${NAME_W}px;color:var(--muted);font-weight:400;font-size:12px">Сотрудник</div>${head.join('')}</div>
      ${rowsHtml}
      ${unHtml}
      ${showToday ? `<div class="todayline" style="left:${todayLeft}px"></div>` : ''}
    </div></div>
    <div class="legend" style="margin-top:10px">
      <span><i class="dot" style="background:var(--st3)"></i>В работе</span><span><i class="dot" style="background:var(--orange)"></i>Горит</span>
      <span><i class="dot" style="background:var(--bad)"></i>Просрочено</span><span><i class="dot" style="background:var(--ok)"></i>Сдано</span>
      <span><i class="dot" style="background:var(--muted);opacity:.6"></i>Серые — не назначены, на стадии «Готов к проектированию»: от даты постановки до последнего дня договора</span>
      <span>Полоска снизу — число задач в день (красная ≥ 3)</span>
    </div>
    ${unNoContract.length ? `<div class="nodates">Не назначены и без даты договора (не на шкале): ${unNoContract.map(r => `<button data-open="${r.id}">№${esc(r.num || '—')}</button>`).join(', ')}</div>` : ''}
    ${noDates.length ? `<div class="nodates">Без дат (не на шкале): ${noDates.map(r => `<button data-open="${r.id}">№${esc(r.num || '—')}${r.owner ? ' · ' + esc(r.owner) : ''}</button>`).join(', ')}</div>` : ''}`;

  // при первом показе прокрутить к «сегодня»
  const tl = $('#loadBody .tl');

async function fbCreate(cfg) {
  const base = `https://www.gstatic.com/firebasejs/${FB_V}/`;
  const [{initializeApp}, A, F] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
  const app = initializeApp(cfg), auth = A.getAuth(app), db = F.getFirestore(app);
  const est = d => d.data({serverTimestamps: 'estimate'});
  const cpath = cid => cid.startsWith('d_') ? ['dms', cid.slice(2)] : ['channels', cid];
  const ms = t => t ? t.toMillis() : 0;
  return {
    onAuth: cb => A.onAuthStateChanged(auth, u => cb(u ? {uid: u.uid, email: u.email} : null)),
    signIn: (e, p) => A.signInWithEmailAndPassword(auth, e, p),
    reset: e => A.sendPasswordResetEmail(auth, e),
    signOut: () => A.signOut(auth),
    saveProfile: (uid, p) => F.setDoc(F.doc(db, 'users', uid), {...p, updatedAt: F.serverTimestamp()}, {merge: true}),
    watchUsers: (cb, err) => F.onSnapshot(F.collection(db, 'users'), s => { const o = {}; s.forEach(d => o[d.id] = d.data()); cb(o); }, err),
    // «Общий» и чаты проектов — коллекция channels; личные переписки (cid вида d_<uid1>_<uid2>) — коллекция dms
    watchChannels: (cb, err, uid, dmErr) => {
      let pub = {}, dms = {};
      const meta = d => { const v = est(d); return {lastAt: ms(v.lastAt), lastBy: v.lastBy || '', lastText: v.lastText || '', lastMentions: v.lastMentions || []}; };
      const u1 = F.onSnapshot(F.collection(db, 'channels'), s => { pub = {}; s.forEach(d => { pub[d.id] = meta(d); }); cb({...pub, ...dms}); }, err);
      const u2 = F.onSnapshot(F.query(F.collection(db, 'dms'), F.where('members', 'array-contains', uid)), s => { dms = {}; s.forEach(d => { dms['d_' + d.id] = meta(d); }); cb({...pub, ...dms}); }, dmErr || err);
      return () => { u1(); u2(); };
    },
    watchMessages: (cid, cb, err) => F.onSnapshot(F.query(F.collection(db, ...cpath(cid), 'messages'), F.orderBy('at', 'desc'), F.limit(150)), s => {
      const a = []; s.forEach(d => { const v = est(d); a.push({id: d.id, uid: v.uid, text: v.text || '', mentions: v.mentions || [], files: v.files || [], at: ms(v.at) || Date.now(), pending: d.metadata.hasPendingWrites}); }); cb(a.reverse());
    }, err),
    send: async (cid, uid, text, mentions, files, preview) => {
      const b = F.writeBatch(db), meta = {lastAt: F.serverTimestamp(), lastBy: uid, lastText: (preview || text).slice(0, 80), lastMentions: mentions};
      if (cid.startsWith('d_')) meta.members = cid.slice(2).split('_');
      const msg = {uid, text, mentions, at: F.serverTimestamp()};
      if (files && files.length) msg.files = files;
      b.set(F.doc(F.collection(db, ...cpath(cid), 'messages')), msg);
      b.set(F.doc(db, ...cpath(cid)), meta, {merge: true});
      await b.commit();
    },
    idToken: () => auth.currentUser.getIdToken(),
    // «прочитано»: момент, до которого каждый участник прочёл этот чат
    watchReads: (cid, cb, err) => F.onSnapshot(F.collection(db, ...cpath(cid), 'reads'), s => { const o = {}; s.forEach(d => { o[d.id] = ms(est(d).at); }); cb(o); }, err),
    markRead: (cid, uid) => F.setDoc(F.doc(db, ...cpath(cid), 'reads', uid), {at: F.serverTimestamp()}),
    // реакции: по одной записи на (сообщение, человек, реакция)
    watchReactions: (cid, cb, err) => F.onSnapshot(F.collection(db, ...cpath(cid), 'reactions'), s => { const a = []; s.forEach(d => { const v = d.data(); a.push({mid: v.mid, uid: v.uid, key: v.key}); }); cb(a); }, err),
    toggleReaction: (cid, mid, uid, key, on) => {
      const ref = F.doc(db, ...cpath(cid), 'reactions', mid + '_' + uid + '_' + key);
      return on ? F.setDoc(ref, {mid, uid, key}) : F.deleteDoc(ref);
    },
    del: (cid, id) => F.deleteDoc(F.doc(db, ...cpath(cid), 'messages', id)),
    // push на этом устройстве: регистрируем обработчик и сохраняем токен в профиле
    enablePush: async (uid, vapid) => {
      const M = await import(base + 'firebase-messaging.js');
      if (!(await M.isSupported())) throw new Error('Браузер не поддерживает push');
      const reg = await navigator.serviceWorker.register('firebase-messaging-sw.js');
      await navigator.serviceWorker.ready;
      const token = await M.getToken(M.getMessaging(app), {vapidKey: vapid, serviceWorkerRegistration: reg});
      if (!token) throw new Error('Не удалось получить токен');
      await F.setDoc(F.doc(db, 'users', uid), {pushTokens: F.arrayUnion(token)}, {merge: true});
      return token;
    },
    disablePush: async (uid, token) => {
      await F.setDoc(F.doc(db, 'users', uid), {pushTokens: F.arrayRemove(token)}, {merge: true});
      try { const M = await import(base + 'firebase-messaging.js'); await M.deleteToken(M.getMessaging(app)); } catch {}
    }
  };
}

/* --- упоминания через @ --- */
// uid всех, кого упомянули в тексте (@Имя). Сначала длинные имена, чтобы «Иван Петров» не принимался за «Иван».
function mentionsOf(text) {
  let rest = text.toLowerCase();
  const list = Object.keys(CHAT.users).filter(u => u !== CHAT.user.uid && CHAT.users[u].name).sort((a, b) => CHAT.users[b].name.length - CHAT.users[a].name.length);
  const res = [];
  list.forEach(u => { const tag = '@' + CHAT.users[u].name.toLowerCase(); if (rest.includes(tag)) { res.push(u); rest = rest.split(tag).join(' '); } });
  return res;
}
function chatMentionUpdate(ta) {
  const before = ta.value.slice(0, ta.selectionStart), m = before.match(/(^|\s)@([^\s@]*)$/);
  if (!m) { chatMentionClose(); return; }
  const q = m[2].toLowerCase();
  const items = Object.keys(CHAT.users).filter(u => u !== CHAT.user.uid && CHAT.users[u].name && (!q || CHAT.users[u].name.toLowerCase().split(/\s+/).some(w => w.startsWith(q)) || CHAT.users[u].name.toLowerCase().startsWith(q))).slice(0, 8);
  if (!items.length) { chatMentionClose(); return; }
  CHAT.mn = {items, idx: 0, start: ta.selectionStart - m[2].length - 1, end: ta.selectionStart};
  chatMentionDraw();
}
function chatMentionDraw() {
  const box = $('#chMn'); if (!box || !CHAT.mn) return;
  box.hidden = false;
  box.innerHTML = CHAT.mn.items.map((u, i) => `<button type="button" class="${i === CHAT.mn.idx ? 'on' : ''}" data-ch="mpick" data-i="${i}">${userAva(u)}<span>${esc(userName(u))}</span></button>`).join('');
}

/* --- уведомления --- */
// Сравниваем каналы до и после обновления: если пришло чужое сообщение, показываем уведомление.
function chatNotifyDiff(prev, next) {
  const mode = noteMode(); if (mode === 'off') return;
  for (const cid in next) {
    const c = next[cid], p = prev[cid];
    if (c.lastBy === CHAT.user.uid || c.lastAt <= (p ? p.lastAt : 0)) continue;
    const mention = c.lastMentions.includes(CHAT.user.uid);
    if (mode === 'mentions' && !mention) continue;
    const watching = S.view === 'chat' && cid === CHAT.cid && !document.hidden && (isDesk() || CHAT.conv);
    if (watching) continue;
    const title = isDm(cid) ? 'Личное сообщение · ' + chTitle(cid).t : (mention ? 'Вас упомянули · ' : '') + chTitle(cid).t;
    const body = userName(c.lastBy) + ': ' + c.lastText;
    if (!document.hidden) toast(title + ' — ' + body);
    if ('Notification' in window && Notification.permission === 'granted' && document.hidden) {
      try {
        const n = new Notification(title, {body, tag: cid, icon: 'icon-180.png'});
        n.onclick = () => { window.focus(); chatOpen(cid); n.close(); };
      } catch {}
    }
    chatBeep();
  }
}
// Звук оповещения внутри приложения (когда оно открыто). Звук push-уведомления на телефоне задаёт сама система, его приложение изменить не может.
const SOUNDS = {
  chime: {t: 'Колокольчик', seq: [[880, 0, .16], [1175, .17, .3]]},
  ding:  {t: 'Динь', seq: [[1320, 0, .5]]},
  pop:   {t: 'Короткий', seq: [[520, 0, .09]], type: 'triangle'},
  triple:{t: 'Три сигнала', seq: [[700, 0, .12], [700, .18, .12], [700, .36, .12]], type: 'square', vol: .06},
  off:   {t: 'Без звука', seq: []}
};
const SOUND_LS = 'mpb-chat-sound';
let beepCtx;
function chatBeep(kind) {
  const s = SOUNDS[kind || lsGet(SOUND_LS, 'chime')] || SOUNDS.chime;
  if (!s.seq.length) return;
  try {
    beepCtx = beepCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (beepCtx.state === 'suspended') beepCtx.resume();
    const t0 = beepCtx.currentTime;
    s.seq.forEach(([f, at, d]) => {
      const o = beepCtx.createOscillator(), g = beepCtx.createGain();
      o.type = s.type || 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(s.vol || .14, t0 + at); g.gain.exponentialRampToValueAtTime(.001, t0 + at + d);
      o.connect(g); g.connect(beepCtx.destination); o.start(t0 + at); o.stop(t0 + at + d + .02);
    });
  } catch {}
}
// браузер разрешает звук только после первого касания страницы
document.addEventListener('click', () => { try { beepCtx = beepCtx || new (window.AudioContext || window.webkitAudioContext)(); if (beepCtx.state === 'suspended') beepCtx.resume(); } catch {} }, {once: true});
// Письмо тому, кого упомянули: уходит через Apps Script (работает, даже если приложение у него закрыто)
// Адрес и ключ берутся из NOTIFY (общие для всех), иначе из «Настроек» этого устройства.
function chatRemoteNotify(uids, text, cid) {
  const url = NOTIFY.url || S.cfg.url, key = NOTIFY.key || S.cfg.key;
  if (!url || !key) return;
  const us = uids.map(u => CHAT.users[u]).filter(Boolean);
  const to = us.filter(u => u.email && u.emailNotify !== false).map(u => u.email);
  const tg = us.filter(u => u.tg && (u.notifyTg ?? true)).map(u => String(u.tg).trim());
  const mx = us.filter(u => u.max && (u.notifyMax ?? true)).map(u => String(u.max).trim());
  const push = [...new Set(us.flatMap(u => u.pushTokens || []))].slice(0, 20);
  if (!to.length && !tg.length && !mx.length && !push.length) return;
  fetch(url, {method: 'POST', redirect: 'follow', headers: {'Content-Type': 'text/plain;charset=utf-8'},
    body: JSON.stringify({action: 'notify', key, to, tg, mx, push, kind: isDm(cid) ? 'dm' : 'mention', from: userName(CHAT.user.uid), channel: isDm(cid) ? userName(CHAT.user.uid) : chTitle(cid).t, text, url: chatLink(cid)})})
    .then(r => r.json()).then(d => { if (!d.ok) toast('Оповещение не отправлено: ' + d.error, true); else if (!d.sent) toast('Оповещение не отправлено: адреса не подошли (проверьте NOTIFY_ALLOWED)', true); }).catch(() => {});
}

function shortTime(t) { if (!t) return ''; const d = new Date(t); return diff(today(), new Date(new Date(t).setHours(0, 0, 0, 0))) === 0 ? hm(t) : String(d.getDate()).padStart(2, '0') + '.' + String(d.getMonth() + 1).padStart(2, '0'); }

/* --- вложения (хранятся на Google Диске владельца, загрузка через Apps Script) --- */
const fmtSize = n => n > 1048576 ? (n / 1048576).toFixed(1) + ' МБ' : Math.max(1, Math.round(n / 1024)) + ' КБ';
function filesHtml(files) {
  return (files || []).map(f => {
    const id = encodeURIComponent(f.id || ''), view = 'https://drive.google.com/file/d/' + id + '/view', dl = 'https://drive.google.com/uc?export=download&id=' + id;
    if (String(f.mime).startsWith('image/')) return `<div class="att"><a class="att-img" href="${view}" target="_blank" rel="noopener"><img loading="lazy" src="https://drive.google.com/thumbnail?id=${id}&sz=w800" alt="${esc(f.name)}"></a><a class="att-dl" href="${dl}">Скачать · ${esc(f.name)}</a></div>`;
    return `<div class="att att-file"><span class="att-ic">${IC.clip}</span><span class="att-nm"><b>${esc(f.name)}</b><small>${fmtSize(f.size || 0)}</small></span><a class="btn" href="${view}" target="_blank" rel="noopener">Открыть</a><a class="btn" href="${dl}">Скачать</a></div>`;
  }).join('');
}
async function prepUpload(file) {
  if (!file.type.startsWith('image/') || file.type === 'image/gif' || file.size < 400 * 1024) return file;
  try {
    const bmp = await createImageBitmap(file), k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const cv = document.createElement('canvas'); cv.width = Math.round(bmp.width * k); cv.height = Math.round(bmp.height * k);
    const g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height); g.drawImage(bmp, 0, 0, cv.width, cv.height);
    const b = await new Promise(r => cv.toBlob(r, 'image/jpeg', .82));
    return b && b.size < file.size ? b : file;
  } catch { return file; }
}
function upName(file, blob) {
  let n = file.name || 'файл';
  if (/^image\.(png|jpe?g)$/i.test(n)) n = 'Скриншот_' + new Date().toISOString().slice(0, 16).replace(/[T:]/g, '-') + '.png';   // вставка из буфера
  if (blob.type === 'image/jpeg' && !/\.jpe?g$/i.test(n)) n = n.replace(/\.[^.]+$/, '') + '.jpg';
  return n;
}
async function chatUploadOne(file, url) {
  const blob = await prepUpload(file);
  if (blob.size > 15 * 1048576) throw new Error('файл больше 15 МБ');
  const data = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = () => rej(new Error('не удалось прочитать файл')); r.readAsDataURL(blob); });
  const resp = await fetch(url, {method: 'POST', redirect: 'follow', headers: {'Content-Type': 'text/plain;charset=utf-8'},
    body: JSON.stringify({action: 'upload', idToken: await CHAT.be.idToken(), name: upName(file, blob), mime: blob.type || file.type || 'application/octet-stream', data})});
  const raw = await resp.text();
  let d; try { d = JSON.parse(raw); } catch { throw new Error('скрипт вернул не тот ответ. Скорее всего, в Apps Script не выполнена функция authorize или не сделана новая версия развёртывания'); }
  if (!d.ok) throw new Error(/Неверный ключ|Неизвестное действие/.test(d.error || '') ? 'в Apps Script старая версия кода: вставьте новый Code.gs и сделайте новую версию развёртывания (' + d.error + ')' : (d.error || 'ошибка сервера'));
  return d.file;
}
let upErrT;
function chatUpStatus() { const el = $('#chUp'); if (!el || el.classList.contains('err')) return; el.hidden = !CHAT.uploads; el.textContent = CHAT.uploads ? 'Загружаю файлы: осталось ' + CHAT.uploads + '…' : ''; }
// ошибка загрузки остаётся на экране, пока её не закроют или не пройдёт 15 секунд
function chatUpError(msg) {
  const el = $('#chUp'); if (!el) { toast(msg, true); return; }
  el.classList.add('err'); el.hidden = false; el.textContent = '⚠ ' + msg + '  (нажмите, чтобы закрыть)';
  clearTimeout(upErrT); upErrT = setTimeout(() => { el.classList.remove('err'); chatUpStatus(); }, 15000);
}
// файл выбран, перетащен или вставлен: загружаем и сразу отправляем сообщением (текст из поля становится подписью)
async function chatUploadFiles(files) {
  files = [...files].slice(0, 10);
  const url = NOTIFY.url || S.cfg.url;
  if (!CHAT.be || !files.length) return;
  if (!url) { toast('Не задан адрес скрипта для файлов (NOTIFY.url)', true); return; }
  const cid = CHAT.cid, ta = $('#chText'), caption = ta ? ta.value.trim() : '';
  if (ta) { ta.value = ''; CHAT.drafts[cid] = ''; }
  CHAT.uploads += files.length; chatUpStatus();
  const done = [];
  for (const f of files) {
    try { done.push(await chatUploadOne(f, url)); }
    catch (e) { chatUpError('Не загружено «' + f.name + '»: ' + e.message); }
    CHAT.uploads--; chatUpStatus();
  }
  if (!done.length) { if (ta && caption && CHAT.cid === cid) ta.value = caption; return; }
  try { await chatPost(cid, caption, done); }
  catch (e) { chatUpError('Файлы загружены, но сообщение не отправлено: ' + (e.code === 'permission-denied' ? 'нет доступа (опубликуйте новые правила Firestore)' : e.message)); }
}
async function chatPost(cid, text, files) {
  const mentions = isDm(cid) ? [dmOther(cid)] : mentionsOf(text);   // в личных сообщениях адресат — собеседник
  const preview = text || '📎 ' + files.map(f => f.name).join(', ');
  await CHAT.be.send(cid, CHAT.user.uid, text, mentions, files, preview);

/* --- реакции и статус прочтения --- */
function rxHtml(m, by) {
  by = by || {};
  // реакции и кнопка «добавить реакцию» стоят сразу под текстом
  let h = '<div class="rxs">' + Object.keys(RX).filter(k => by[k]).map(k => {
    const us = by[k], mine = us.includes(CHAT.user.uid);
    return `<button class="rx ${mine ? 'on' : ''}" data-ch="rx" data-mid="${esc(m.id)}" data-k="${k}" title="${esc(us.map(userName).join(', '))}">${RX[k]} ${us.length}</button>`;
  }).join('') + (m.pending ? '' : `<button class="rx-add" data-ch="rxpick" data-mid="${esc(m.id)}" title="Поставить реакцию" aria-label="Поставить реакцию">☺</button>`) + '</div>';
  if (CHAT.rxOpen === m.id) h += '<div class="rx-pick">' + Object.keys(RX).map(k => `<button data-ch="rx" data-mid="${esc(m.id)}" data-k="${k}">${RX[k]}</button>`).join('') + '</div>';
  return h;
}
function readLine(m) {
  const me = CHAT.user.uid;
  if (CHAT.users[me]?.showRead === false) return '';   // кто скрывает свой статус, чужие тоже не видит
  const readBy = u => u !== me && CHAT.reads[u] >= m.at && CHAT.users[u]?.showRead !== false;
  if (isDm(CHAT.cid)) {
    const o = dmOther(CHAT.cid);
    return readBy(o) ? `<div class="ch-read ok">✓✓ Прочитано · ${hm(CHAT.reads[o])}</div>` : '<div class="ch-read">✓ Отправлено</div>';
  }
  const names = Object.keys(CHAT.users).filter(readBy).map(u => userName(u).split(' ')[0]);
  const total = Object.keys(CHAT.users).filter(u => u !== me).length;
  if (!names.length) return '<div class="ch-read">Пока никто не прочитал</div>';
  return `<div class="ch-read ok" title="${esc(names.join(', '))}">✓✓ Прочитали ${names.length} из ${total}: ${esc(names.slice(0, 4).join(', '))}${names.length > 4 ? ' и ещё ' + (names.length - 4) : ''}</div>`;
}
// запись «я прочитал этот чат до сих пор» (не чаще, чем появляются новые сообщения)
function chatPushRead() {
  if (!CHAT.be || !CHAT.msgs.length) return;
  const latest = Math.max(...CHAT.msgs.filter(m => !m.pending).map(m => m.at), 0);
  if (!latest || latest <= (CHAT.readSent[CHAT.cid] || 0)) return;
  CHAT.readSent[CHAT.cid] = latest;
  CHAT.be.markRead(CHAT.cid, CHAT.user.uid).catch(() => {});
}

function chatAction(t) {
