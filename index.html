  if (a === 'open') { CHAT.cid = t.dataset.cid; CHAT.conv = true; renderChat(); }
  else if (a === 'back') { CHAT.conv = false; renderChat(); }
  else if (a === 'send') chatSend();
  else if (a === 'project') { closeSheet(); chatOpen('p' + t.dataset.id); }
  else if (a === 'reset') chatReset();
  else if (a === 'profile') openProfile();
  else if (a === 'profsave') profileSave();
  else if (a === 'mpick') chatMentionPick(+t.dataset.i);
  else if (a === 'attach') $('#chFile')?.click();
  else if (a === 'rxpick') { CHAT.rxOpen = CHAT.rxOpen === t.dataset.mid ? null : t.dataset.mid; chatFillMsgs(); }
  else if (a === 'rx') {
    const mid = t.dataset.mid, k = t.dataset.k, me = CHAT.user.uid, cid = CHAT.cid;
    const mine = CHAT.rx.some(r => r.mid === mid && r.uid === me && r.key === k);
    CHAT.rxOpen = null;
    CHAT.rx = mine ? CHAT.rx.filter(r => !(r.mid === mid && r.uid === me && r.key === k)) : [...CHAT.rx, {mid, uid: me, key: k}];
    chatFillMsgs();   // сразу показываем, затем подтверждает сервер
    CHAT.be.toggleReaction(cid, mid, me, k, !mine).catch(e => toast('Реакция не сохранена: ' + (e.code === 'permission-denied' ? 'не опубликованы правила Firestore' : e.message), true));
  }
  else if (a === 'members') openMembers();
  else if (a === 'copyfolder') {
    const d = editing?.draft; if (!d) return;
    const nm = `${String(d.num).trim()}. ${d.object || ''}`.trim();
    (navigator.clipboard ? navigator.clipboard.writeText(nm) : Promise.reject()).then(() => toast('Имя папки скопировано'), () => prompt('Скопируйте имя папки:', nm));
  }
  else if (a === 'copylink') {
    const link = chatLink(CHAT.cid);
    (navigator.clipboard ? navigator.clipboard.writeText(link) : Promise.reject()).then(() => toast('Ссылка скопирована'), () => prompt('Скопируйте ссылку:', link));
  }
  else if (a === 'mem') chatMentionUser(t.dataset.uid);
  else if (a === 'dm') { closeSheet(); if (t.dataset.uid && t.dataset.uid !== CHAT.user.uid) chatOpen(dmCid(t.dataset.uid)); }
  else if (a === 'nmode') { lsSet(NOTE_KEY, t.dataset.v); drawProfile(); }
  else if (a === 'nperm') Notification.requestPermission().then(() => drawProfile());
  else if (a === 'photodel') { profDraft.avatar = null; drawProfile(); }
  else if (a === 'pushon') {
    // запрос разрешения должен идти сразу по нажатию (требование iOS)
    Notification.requestPermission().then(async perm => {
      if (perm !== 'granted') { toast('Уведомления не разрешены', true); drawProfile(); return; }
      try { lsSet(PUSH_LS, await CHAT.be.enablePush(CHAT.user.uid, VAPID_KEY)); toast('Уведомления включены'); }
      catch (e) { toast('Не удалось включить: ' + (e.message || e.code), true); }

  else if (a === 'snd') { lsSet(SOUND_LS, t.dataset.v); chatBeep(t.dataset.v); drawProfile(); }
  else if (a === 'pushtest') {
    const tok = lsGet(PUSH_LS, null), url = NOTIFY.url || S.cfg.url, key = NOTIFY.key || S.cfg.key;
    if (!tok || !url || !key) { toast('Нет токена или адреса скрипта оповещений', true); return; }
    toast('Отправляю тестовое уведомление…');
    fetch(url, {method: 'POST', redirect: 'follow', headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify({action: 'notify', key, push: [tok], from: 'Проекты DS', channel: 'Проверка', text: 'Тестовое уведомление. Если вы это видите, push работает.', url: chatLink('general')})})
      .then(r => r.json()).then(d => toast(d.ok ? 'Отправлено (доставлено: ' + d.sent + '). Заблокируйте телефон и подождите несколько секунд.' : 'Ошибка: ' + d.error, !d.ok))
      .catch(e => toast('Нет связи со скриптом: ' + e.message, true));
  }
  else if (a === 'pushoff') {
    const tok = lsGet(PUSH_LS, null); lsDel(PUSH_LS);
    (tok ? CHAT.be.disablePush(CHAT.user.uid, tok) : Promise.resolve()).catch(() => {}).finally(() => { toast('Уведомления отключены'); drawProfile(); });
  }
  else if (a === 'logout') {
    closeSheet();
    const tok = lsGet(PUSH_LS, null); lsDel(PUSH_LS);   // чтобы уведомления прежнего пользователя не шли на этот телефон
    (tok ? CHAT.be.disablePush(CHAT.user.uid, tok).catch(() => {}) : Promise.resolve()).finally(() => CHAT.be.signOut());
  }
  else if (a === 'del') { if (confirm('Удалить сообщение?')) CHAT.be.del(CHAT.cid, t.dataset.id).catch(e => toast('Не удалено: ' + e.message, true)); }

    <div class="sh-body">${ids.map(u => u === me
      ? `<div class="mem-row"><div class="mem">${userAva(u)}<span><b>${esc(userName(u))} (вы)</b><small>${esc(CHAT.users[u].position || 'Должность не указана')}</small></span></div></div>`
      : `<div class="mem-row"><button class="mem" data-ch="dm" data-uid="${esc(u)}" title="Написать лично">${userAva(u)}<span><b>${esc(userName(u))}</b><small>${esc(CHAT.users[u].position || 'Должность не указана')}</small></span></button><button class="ch-ico" data-ch="mem" data-uid="${esc(u)}" title="Упомянуть в текущем чате" aria-label="Упомянуть">@</button></div>`).join('')}</div>`;
  $('#scrim').classList.add('on'); $('#sheet').classList.add('on');
}
function chatMentionUser(uid) {
  closeSheet();
  if (uid === CHAT.user.uid) return;
  const cur = CHAT.drafts[CHAT.cid] || '';
  CHAT.drafts[CHAT.cid] = cur + (cur && !/\s$/.test(cur) ? ' ' : '') + '@' + userName(uid) + ' ';
  CHAT.conv = true; CHAT.mn = null; renderChat();
  const ta = $('#chText'); if (ta) { ta.value = CHAT.drafts[CHAT.cid]; ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
}

/* --- push-уведомления на телефон --- */
function pushBlock() {
  const supported = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
  const standalone = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
  const tok = lsGet(PUSH_LS, null);
  const p = t => `<p style="font-size:13px;color:var(--muted);margin:6px 0 0">${t}</p>`;
  let h = '<div class="pf-sec" style="margin-top:14px">Push-уведомления на этом телефоне</div>';
  if (ios && !standalone) h += p('На iPhone уведомления работают только в приложении с экрана «Домой». Нажмите в Safari «Поделиться» → «На экран Домой», откройте иконку приложения и включите уведомления здесь.');
  else if (!supported) h += p('Этот браузер не поддерживает push-уведомления.');
  else if (Notification.permission === 'denied') h += p('Уведомления запрещены. Разрешите их в настройках телефона (Настройки → Уведомления → это приложение) и вернитесь сюда.');
  else if (tok && Notification.permission === 'granted') h += `<p style="font-size:13px;color:var(--ok);margin:6px 0 8px">Включены на этом устройстве. Приходят, когда вас упомянули через @.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" type="button" data-ch="pushtest">Отправить тестовое уведомление</button><button class="btn" type="button" data-ch="pushoff">Отключить на этом устройстве</button></div>`;
  else h += `<button class="btn primary" type="button" data-ch="pushon" style="margin-top:6px">Включить уведомления на телефоне</button>${p('Придёт запрос на разрешение: нажмите «Разрешить». Уведомления приходят, когда вас упомянули через @.')}`;
  return h;
}

/* --- профиль --- */
let profDraft = null;
function openProfile() {
  if (!CHAT.user) return;
  editing = null;
  const u = CHAT.users[CHAT.user.uid] || {};
  profDraft = {name: u.name || (CHAT.user.email || '').split('@')[0], avatar: u.avatar || null, emailNotify: u.emailNotify !== false, tg: u.tg || '', max: u.max || '', showRead: u.showRead !== false, tgOn: u.notifyTg ?? !!u.tg, maxOn: u.notifyMax ?? !!u.max, position: u.position || ''};
  drawProfile();
  $('#scrim').classList.add('on'); $('#sheet').classList.add('on');
}
function drawProfile() {
  const d = profDraft, n = d.name || '?';
  const av = d.avatar && String(d.avatar).startsWith('data:image/') ? `<img class="ava ava-big" src="${esc(d.avatar)}" alt="">` : `<span class="ava ava-big" style="background:${avaColor(n)}">${esc(initials(n))}</span>`;
  $('#sheet').innerHTML = `
    <div class="grab"></div>
    <div class="sh-head"><div style="flex:1"><h2>Мой профиль</h2><div class="sub">${esc(CHAT.user.email || '')}</div></div><button class="x" data-act="close" aria-label="Закрыть">${IC.x}</button></div>
    <div class="sh-body">
      <div class="pf-ava">${av}<div class="btns">
        <label class="btn" for="pf-file" style="cursor:pointer">Загрузить фото</label><input type="file" id="pf-file" accept="image/*" hidden>
        ${d.avatar ? '<button class="btn ghost" type="button" data-ch="photodel">Убрать фото</button>' : ''}</div></div>
      <div class="fld"><label for="pf-name">Имя в чате</label><input id="pf-name" maxlength="40" value="${esc(d.name)}" placeholder="Например, Иван Петров"></div>
      <div class="fld"><label for="pf-pos">Должность</label><input id="pf-pos" maxlength="60" list="dl-pos" value="${esc(d.position)}" placeholder="Например, ГИП, инженер-проектировщик">
        <datalist id="dl-pos"><option value="Руководитель проектного отдела"><option value="ГИП"><option value="Инженер-проектировщик"><option value="Ведущий инженер"><option value="Проектировщик СПС/СОУЭ"><option value="Менеджер проектов"></datalist>
        <p style="font-size:12px;color:var(--muted);margin:6px 0 0">Менеджеры проектов и руководитель отдела получают оповещения о смене стадии задач, руководитель ещё и о «Срочных» задачах. Исполнителю приходит оповещение, когда ему ставят задачу (имя в реестре должно совпадать с вашим именем или первым словом: «Иван» ↔ «Иван Петров»).</p></div>
      <div class="pf-sec">Уведомления на этом устройстве</div>
      <div class="seg">${[['all', 'Все сообщения'], ['mentions', 'Только @упоминания'], ['off', 'Выключены']].map(([v, t]) => `<button type="button" data-ch="nmode" data-v="${v}" class="${noteMode() === v ? 'on' : ''}">${t}</button>`).join('')}</div>
      ${'Notification' in window ? (Notification.permission === 'granted' ? '<p style="font-size:13px;color:var(--ok);margin:8px 0 0">Уведомления браузера разрешены (приходят, когда вкладка свёрнута).</p>'
        : Notification.permission === 'denied' ? '<p style="font-size:13px;color:var(--muted);margin:8px 0 0">Уведомления браузера запрещены в настройках сайта. Остаются звук, плашка и значок на вкладке.</p>'
        : '<button class="btn" type="button" data-ch="nperm" style="margin-top:8px">Разрешить уведомления браузера</button>') : ''}
      <div class="pf-sec" style="margin-top:14px">Звук оповещения в приложении</div>
      <div class="seg">${Object.entries(SOUNDS).map(([k, s]) => `<button type="button" data-ch="snd" data-v="${k}" class="${lsGet(SOUND_LS, 'chime') === k ? 'on' : ''}">${s.t}</button>`).join('')}</div>
      <p style="font-size:12px;color:var(--muted);margin:6px 0 0">Нажмите на звук, чтобы прослушать. Это звук внутри открытого приложения; звук уведомления на заблокированном телефоне настраивается в системе.</p>
      <label class="pf-chk"><input type="checkbox" id="pf-read" ${d.showRead ? 'checked' : ''}>Показывать другим, что я прочитал(а) сообщение</label>
      <p style="font-size:12px;color:var(--muted);margin:-6px 0 12px">Если выключить, вы тоже не будете видеть, кто прочитал ваши сообщения.</p>
      <label class="pf-chk"><input type="checkbox" id="pf-mail" ${d.emailNotify ? 'checked' : ''}>Присылать на почту, когда меня упомянули</label>
      <div class="pf-sec" style="margin-top:14px">Получать оповещения в мессенджер</div>
      <label class="pf-chk"><input type="checkbox" id="pf-tgon" ${d.tgOn ? 'checked' : ''}>Telegram</label>
      ${d.tgOn ? `<div class="fld"><label for="pf-tg">Telegram ID</label><input id="pf-tg" inputmode="numeric" maxlength="20" value="${esc(d.tg)}" placeholder="например 123456789">
        <p style="font-size:13px;color:var(--muted);margin:6px 0 0"><b>Как подключить:</b><br>1. Откройте в Telegram бота <b>@proekty_ds_bot</b> и нажмите <b>Start</b>.<br>2. Напишите боту <b>@userinfobot</b>: он ответит вашим числовым Id.<br>3. Вставьте это число в поле выше и нажмите «Сохранить».</p></div>` : ''}
      <label class="pf-chk"><input type="checkbox" id="pf-maxon" ${d.maxOn ? 'checked' : ''}>MAX</label>
      ${d.maxOn ? `<div class="fld"><label for="pf-max">MAX ID</label><input id="pf-max" inputmode="numeric" maxlength="20" value="${esc(d.max)}" placeholder="например 123456789">
        <p style="font-size:13px;color:var(--muted);margin:6px 0 0"><b>Как подключить:</b><br>1. Найдите в MAX бота <b>id420591350788_bot</b> (через поиск) и нажмите «Начать» или напишите ему <b>/start</b>.<br>2. В течение минуты бот ответит вашим числовым ID.<br>3. Вставьте это число в поле выше и нажмите «Сохранить».</p></div>` : ''}
      ${pushBlock()}
      <button class="btn" type="button" data-ch="logout" style="margin-top:14px">Выйти из аккаунта</button>
    </div>
    <div class="sh-foot"><button class="btn" data-act="close">Отмена</button><button class="btn primary" data-ch="profsave">Сохранить</button></div>`;
  $('#pf-name').addEventListener('input', e => { profDraft.name = e.target.value; });
  $('#pf-mail').addEventListener('change', e => { profDraft.emailNotify = e.target.checked; });
  $('#pf-read').addEventListener('change', e => { profDraft.showRead = e.target.checked; });
  $('#pf-pos').addEventListener('input', e => { profDraft.position = e.target.value; });
  $('#pf-max')?.addEventListener('input', e => { profDraft.max = e.target.value.replace(/\D/g, ''); });
  $('#pf-tg')?.addEventListener('input', e => { profDraft.tg = e.target.value.replace(/\D/g, ''); });
  const redraw = () => { const sc = $('#sheet .sh-body').scrollTop; drawProfile(); $('#sheet .sh-body').scrollTop = sc; };
  $('#pf-tgon').addEventListener('change', e => { profDraft.tgOn = e.target.checked; redraw(); });
  $('#pf-maxon').addEventListener('change', e => { profDraft.maxOn = e.target.checked; redraw(); });
}
async function profilePhoto(file) {
  try {
    const img = await createImageBitmap(file);
    const s = Math.min(img.width, img.height), cv = document.createElement('canvas'); cv.width = cv.height = 160;
    const g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, 160, 160);
    g.drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, 160, 160);
    profDraft.avatar = cv.toDataURL('image/jpeg', 0.85);
    drawProfile();
  } catch { toast('Не удалось прочитать картинку', true); }
}
async function profileSave() {
  const name = (profDraft.name || '').trim();
  if (!name) { toast('Укажите имя', true); return; }
  try {
    await CHAT.be.saveProfile(CHAT.user.uid, {name: name.slice(0, 40), avatar: profDraft.avatar || null, email: CHAT.user.email || '', emailNotify: !!profDraft.emailNotify, showRead: !!profDraft.showRead, tg: profDraft.tg || '', max: profDraft.max || '', notifyTg: !!profDraft.tgOn, notifyMax: !!profDraft.maxOn, position: (profDraft.position || '').trim().slice(0, 60)});
    closeSheet(); toast('Профиль сохранён');
  } catch (e) { toast('Не сохранено: ' + (e.code === 'permission-denied' ? 'нет доступа' : e.message), true); }
}

// Ссылка вида …/index.html#chat=p6 открывает нужный диалог (general — общий чат, p<номер> — чат проекта)
// Основной вид ссылки: …/index.html?chat=p6 (параметр не теряется в мессенджерах), также понимаем старый …#chat=p6
const chatLink = cid => location.origin + location.pathname + '?chat=' + cid;
function chatApplyHash() {
  const m = new URLSearchParams(location.search).get('chat') || (location.hash.match(/^#chat=(.+)$/) || [])[1];
  if (!m || !/^(general|p\d+|d_[A-Za-z0-9]+_[A-Za-z0-9]+)$/.test(m)) return false;
  CHAT.cid = m; CHAT.conv = true; S.view = 'chat'; lsSet(LS.view, S.view);
  history.replaceState(null, '', location.pathname);
  return true;
}
window.addEventListener('hashchange', () => { if (chatApplyHash()) renderAll(); });
chatApplyHash();
(() => {
  const t = new URLSearchParams(location.search).get('task');
  if (t && /^\d+$/.test(t)) { S.pendingTask = +t; S.view = 'overview'; history.replaceState(null, '', location.pathname); }
})();
chatInit();
load();
</script>
